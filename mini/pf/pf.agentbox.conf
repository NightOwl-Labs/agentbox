# Installed to /etc/pf.agentbox.conf: Apple's default anchors plus the agentbox anchor.
# Loaded at boot by the <prefix>.pf launch daemon. /etc/pf.conf is left untouched so macOS
# updates can't overwrite this.
scrub-anchor "com.apple/*"
nat-anchor "com.apple/*"
rdr-anchor "com.apple/*"
dummynet-anchor "com.apple/*"
anchor "com.apple/*"
load anchor "com.apple" from "/etc/pf.anchors/com.apple"
anchor "agentbox"
load anchor "agentbox" from "/etc/pf.anchors/agentbox"
