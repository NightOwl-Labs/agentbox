# Added by agentbox guardrails. Provisions infrastructure from infra/<provider>/ directories.
#   pull request  -> plan every directory against the "preview" environment
#   merge to main -> apply every directory in the "production" environment, which waits
#                    for an approved reviewer (humans only while ORCH_AUTO_APPROVE=false)
# A directory with *.tf files is OpenTofu. A directory with fly.toml is deployed with flyctl.
# Credentials come from the environment that cicd/connect-provider.sh filled in.
name: iac
on:
  pull_request:
    paths: ["infra/**"]
  push:
    branches: [main]
    paths: ["infra/**"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: iac-${{ github.ref }}
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      dirs: ${{ steps.find.outputs.dirs }}
    steps:
      - uses: actions/checkout@v4
      - id: find
        run: |
          if [ -d infra ]; then
            dirs="$(find infra -mindepth 1 -maxdepth 1 -type d | sort | jq -R . | jq -sc .)"
          else
            dirs='[]'
          fi
          echo "dirs=$dirs" >> "$GITHUB_OUTPUT"

  plan:
    needs: discover
    if: github.event_name == 'pull_request' && needs.discover.outputs.dirs != '[]'
    runs-on: ubuntu-latest
    environment: preview
    permissions:
      contents: read
      id-token: write   # Azure OIDC
    strategy:
      fail-fast: false
      matrix:
        dir: ${{ fromJson(needs.discover.outputs.dirs) }}
    env:
      DIR: ${{ matrix.dir }}
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      ARM_USE_OIDC: "true"
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      VERCEL_API_TOKEN: ${{ secrets.VERCEL_API_TOKEN }}
      NETLIFY_API_TOKEN: ${{ secrets.NETLIFY_API_TOKEN }}
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      RENDER_OWNER_ID: ${{ vars.RENDER_OWNER_ID }}
    steps:
      - uses: actions/checkout@v4
      - id: kind
        run: |
          if ls "$DIR"/*.tf >/dev/null 2>&1; then echo "kind=tofu" >> "$GITHUB_OUTPUT"
          elif [ -f "$DIR/fly.toml" ]; then echo "kind=fly" >> "$GITHUB_OUTPUT"
          else echo "kind=none" >> "$GITHUB_OUTPUT"; fi
      - if: steps.kind.outputs.kind == 'tofu'
        uses: opentofu/setup-opentofu@v1
      - if: steps.kind.outputs.kind == 'tofu'
        run: |
          tofu -chdir="$DIR" fmt -check
          tofu -chdir="$DIR" init -input=false
          tofu -chdir="$DIR" plan -input=false -no-color -lock-timeout=5m | tee plan.txt
          { echo "### Plan for \`$DIR\`"; echo '```'; tail -c 60000 plan.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - if: steps.kind.outputs.kind == 'fly'
        uses: superfly/flyctl-actions/setup-flyctl@1.5
      - if: steps.kind.outputs.kind == 'fly'
        run: flyctl config validate -c "$DIR/fly.toml"

  apply:
    needs: discover
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.discover.outputs.dirs != '[]'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        dir: ${{ fromJson(needs.discover.outputs.dirs) }}
    env:
      DIR: ${{ matrix.dir }}
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      ARM_USE_OIDC: "true"
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      VERCEL_API_TOKEN: ${{ secrets.VERCEL_API_TOKEN }}
      NETLIFY_API_TOKEN: ${{ secrets.NETLIFY_API_TOKEN }}
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      RENDER_OWNER_ID: ${{ vars.RENDER_OWNER_ID }}
    steps:
      - uses: actions/checkout@v4
      - id: kind
        run: |
          if ls "$DIR"/*.tf >/dev/null 2>&1; then echo "kind=tofu" >> "$GITHUB_OUTPUT"
          elif [ -f "$DIR/fly.toml" ]; then echo "kind=fly" >> "$GITHUB_OUTPUT"
          else echo "kind=none" >> "$GITHUB_OUTPUT"; fi
      - if: steps.kind.outputs.kind == 'tofu'
        uses: opentofu/setup-opentofu@v1
      - if: steps.kind.outputs.kind == 'tofu'
        run: |
          tofu -chdir="$DIR" init -input=false
          tofu -chdir="$DIR" apply -input=false -auto-approve -lock-timeout=5m
      - if: steps.kind.outputs.kind == 'fly'
        uses: superfly/flyctl-actions/setup-flyctl@1.5
      - if: steps.kind.outputs.kind == 'fly'
        run: flyctl deploy --remote-only -c "$DIR/fly.toml"
