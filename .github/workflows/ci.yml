name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  secret-scan:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks (checksum verified)
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v$GITLEAKS_VERSION"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLO "$base/$tarball"
          curl -fsSL "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt" | grep " $tarball\$" | sha256sum --check
          tar -xzf "$tarball" gitleaks
      - name: Scan full history
        run: ./gitleaks git --redact --no-banner
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: |
          shellcheck -S warning -x lib/*.sh prep/*.sh cicd/*.sh cicd/providers/*.sh \
            mini/*.sh mini/scripts/*.sh mini/user/* mini/admin/* validation/*.sh .githooks/*
  config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Config loads and every template renders
        run: |
          for cfg in config.env config.example.env; do
            AGENTBOX_CONFIG="$PWD/$cfg" bash -c 'source lib/config.sh; APPROVAL_RULE=x; TEMPLATE_VARS="$TEMPLATE_VARS APPROVAL_RULE"
              for f in $(find mini/profiles mini/prompts mini/ssh cicd/templates prep -type f \( -name "*.md" -o -name "*.env" -o -name "*.conf" -o -name "*.json" -o -name "*.yml" -o -name "*.csv" -o -name CODEOWNERS \)); do
                out="$(render "$f" 2>&1 >/dev/null)"; [ -z "$out" ] || { echo "$f: $out"; exit 1; }
              done'
          done
      - name: JSON is valid
        run: for f in mini/policy/*.json mini/profiles/*/settings.json prep/*.json; do jq empty "$f"; done
